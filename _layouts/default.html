<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% include META %}
    {% include HEAD %}
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/screen.css" />
    <link rel="alternate" type="application/rss+xml" href="{{ site.baseurl }}/feed.xml">
    {% if page.css %}<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}{{ page.url}}{{ page.css }}" />{% endif %}

    {% if content contains "data-lottie" %}<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>{% endif %}
    <script src="{{ site.baseurl }}/assets/js/main.js?v=2" defer></script>
    {% if page.js %}<script src="{{ site.baseurl }}/{{ page.js }}" defer></script>{% endif %}

<!-- Matomo -->
<script>
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
                var u="//shop.fontclubbelgica.com/matomo/";
                _paq.push(['setTrackerUrl', u+'matomo.php']);
                _paq.push(['setSiteId', '1']);
                var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
                g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
        })();
</script>
<!-- End Matomo Code -->

</head>
<body class="{{ page.path | replace: '.md', '' | split: '/' | last }}">

{% include header %}

{{ content }}

{% include footer %}

</body>
</html>

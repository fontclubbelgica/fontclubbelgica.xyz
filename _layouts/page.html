<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>{{ site.name }}</title>

    {% include META %}
    {% include HEAD %}

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    {% if page.css %}<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}{{ page.url}}{{ page.css }}" />{% endif %}
</head>
<body>

{% include header %}

<content>
{% if page.title %}
<h1>{{ page.title }}</h1>
{% endif %}

{{ content }}
</content>

{% include footer %}
</body>
</html>
